# Env-var driven so the SAME project runs locally and in CI. No secrets committed.
# Local: set DATABRICKS_HOST / DATABRICKS_HTTP_PATH / DATABRICKS_TOKEN as env vars.
# CI:    GitHub repository secrets of the same names inject these at runtime.
atliq_gold:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: atliq
      schema: gold
      threads: 4
    ci:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: atliq
      schema: ci          # throwaway schema so CI never touches prod Gold
      threads: 4
