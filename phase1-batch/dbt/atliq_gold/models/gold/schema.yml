version: 2
models:
  - name: dim_customer
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_product
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: unit_price
        tests: [not_null]

  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: fact_sales
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships: { to: ref('dim_customer'), field: customer_id }
      - name: product_id
        tests:
          - not_null
          - relationships: { to: ref('dim_product'), field: product_id }
      - name: date_key
        tests:
          - relationships: { to: ref('dim_date'), field: date_key }
      - name: gross_revenue
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: status
        tests:
          - accepted_values:
              values: ['Placed','Shipped','Delivered','Cancelled','Returned']